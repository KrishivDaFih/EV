<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.V. — field assistant</title>
<style>
  :root {
    --charcoal: #16130f;
    --charcoal-2: #1e1a15;
    --panel: #221d17;
    --line: #3a3229;
    --paper: #ede4d6;
    --paper-dim: #b3a793;
    --spider-red: #b8302f;
    --spider-red-dim: #7a2624;
    --amber: #e8a25a;
    --amber-dim: #6b5330;
    --ok: #7ea87a;
    font-size: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--charcoal);
    color: var(--paper);
    font-family: 'Iowan Old Style', 'Georgia', serif;
    overflow: hidden;
  }

  @font-face {
    font-family: 'Local Mono';
    src: local('JetBrains Mono'), local('Courier New');
  }

  .mono {
    font-family: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(184,48,47,0.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px),
      var(--charcoal);
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 28px 10px;
    border-bottom: 1px solid var(--line);
  }

  .wordmark {
    font-family: 'Iowan Old Style', Georgia, serif;
    font-size: 1.6rem;
    letter-spacing: 0.04em;
    color: var(--paper);
  }
  .wordmark span {
    color: var(--spider-red);
  }

  .subhead {
    font-size: 0.8rem;
    color: var(--paper-dim);
    font-style: italic;
    margin-left: 12px;
  }

  .status {
    font-size: 0.72rem;
    color: var(--amber);
    text-align: right;
    line-height: 1.5;
  }
  .status .dim { color: var(--paper-dim); }
  .status .pulse {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
    margin-right: 6px;
    box-shadow: 0 0 6px var(--ok);
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ---------- main layout ---------- */
  main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 0;
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 240px 1fr; }
  }

  /* ---------- scan / web panel ---------- */
  .scan-panel {
    position: relative;
    border-right: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  @media (max-width: 820px) {
    .scan-panel { border-right: none; border-bottom: 1px solid var(--line); }
  }

  .web-wrap { position: relative; width: 100%; max-width: 280px; }

  svg#web { width: 100%; height: auto; display: block; }

  .web-line { stroke: var(--line); stroke-width: 1; fill: none; }
  .web-ring { stroke: var(--spider-red-dim); stroke-width: 1; fill: none; opacity: 0.8; }

  .sweep {
    transform-origin: 140px 140px;
    animation: rotate 5.5s linear infinite;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .sweep-line {
    stroke: var(--amber);
    stroke-width: 1.5;
    opacity: 0.85;
  }
  .sweep-fill { fill: url(#sweepGradient); }

  .node {
    fill: var(--paper);
    opacity: 0.65;
  }
  .node.hit { fill: var(--amber); }

  .center-dot {
    fill: var(--spider-red);
  }

  .scan-caption {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.68rem;
    color: var(--paper-dim);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  /* ---------- chat panel ---------- */
  .chat-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .entry {
    max-width: 70ch;
    line-height: 1.55;
    font-size: 0.98rem;
  }

  .entry .who {
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
    color: var(--paper-dim);
  }
  .entry.ev .who { color: var(--amber); }
  .entry.you .who { color: var(--paper-dim); text-align: right; }
  .entry.you { align-self: flex-end; text-align: right; }
  .entry.system .who { color: var(--spider-red); }
  .entry.system { font-size: 0.82rem; color: var(--paper-dim); font-style: italic; }

  .entry.ev .body {
    padding: 12px 15px;
    background: var(--panel);
    border-left: 2px solid var(--spider-red-dim);
    border-radius: 2px;
  }
  .entry.you .body {
    padding: 12px 15px;
    background: transparent;
    border-right: 2px solid var(--line);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--amber);
    animation: tick 1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes tick { 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  /* ---------- input ---------- */
  .composer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    padding: 14px 28px 18px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .composer textarea {
    flex: 1;
    resize: none;
    background: var(--charcoal-2);
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: 3px;
    min-height: 44px;
    max-height: 140px;
    line-height: 1.4;
  }
  .composer textarea:focus {
    outline: none;
    border-color: var(--spider-red-dim);
  }
  .composer textarea::placeholder { color: var(--paper-dim); }

  .send {
    background: var(--spider-red-dim);
    color: var(--paper);
    border: 1px solid var(--spider-red);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 12px 16px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .send:hover { background: var(--spider-red); }
  .send:disabled { opacity: 0.4; cursor: default; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<div id="app">

  <header>
    <div>
      <span class="wordmark">E<span>.</span>V<span>.</span></span>
      <span class="subhead">homemade. still learning the neighborhood.</span>
    </div>
    <div class="status mono">
      <div><span class="pulse"></span>link stable</div>
      <div class="dim" id="clock">—</div>
    </div>
  </header>

  <main>
    <div class="scan-panel">
      <div class="web-wrap">
        <svg id="web" viewBox="0 0 280 280">
          <defs>
            <radialGradient id="sweepGradient" cx="0%" cy="0%" r="100%">
              <stop offset="0%" stop-color="#e8a25a" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#e8a25a" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- concentric web rings -->
          <circle class="web-ring" cx="140" cy="140" r="30"/>
          <circle class="web-ring" cx="140" cy="140" r="65"/>
          <circle class="web-ring" cx="140" cy="140" r="100"/>
          <circle class="web-ring" cx="140" cy="140" r="132" opacity="0.4"/>

          <!-- radial spokes -->
          <g class="web-line">
            <line x1="140" y1="140" x2="140" y2="10"/>
            <line x1="140" y1="140" x2="228" y2="52"/>
            <line x1="140" y1="140" x2="270" y2="140"/>
            <line x1="140" y1="140" x2="228" y2="228"/>
            <line x1="140" y1="140" x2="140" y2="270"/>
            <line x1="140" y1="140" x2="52" y2="228"/>
            <line x1="140" y1="140" x2="10" y2="140"/>
            <line x1="140" y1="140" x2="52" y2="52"/>
          </g>

          <!-- irregular web threads, hand-strung look -->
          <path class="web-line" d="M140,110 L163,120 L175,140 L163,163 L140,172 L118,163 L108,140 L118,120 Z" opacity="0.7"/>
          <path class="web-line" d="M140,75 L198,98 L222,140 L198,182 L140,205 L83,182 L58,140 L83,98 Z" opacity="0.5"/>

          <!-- tracked nodes -->
          <circle class="node" cx="198" cy="98" r="3"/>
          <circle class="node hit" cx="83" cy="182" r="3.5"/>
          <circle class="node" cx="222" cy="140" r="3"/>
          <circle class="node" cx="118" cy="163" r="3"/>
          <circle class="node" cx="58" cy="140" r="3"/>

          <!-- rotating sweep -->
          <g class="sweep">
            <path class="sweep-fill" d="M140,140 L140,10 A130,130 0 0,1 205,32 Z"/>
            <line class="sweep-line" x1="140" y1="140" x2="140" y2="10"/>
          </g>

          <circle class="center-dot" cx="140" cy="140" r="5"/>
        </svg>
        <div class="scan-caption mono">grid scan · 4 blocks · quiet</div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="log" id="log">
        <div class="entry system">
          <div class="who mono">system</div>
          <div class="body">E.V. booted. voice link text-only in this build — talk to her like you would through the earpiece.</div>
        </div>
        <div class="entry ev">
          <div class="who mono">E.V.</div>
          <div class="body">Hey. I'm up. What's going on out there?</div>
        </div>
      </div>

      <div class="composer">
        <textarea id="input" placeholder="Talk to E.V…" rows="1"></textarea>
        <button class="send" id="sendBtn">send</button>
      </div>
    </div>
  </main>

</div>

<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const clock = document.getElementById('clock');

  function tickClock() {
    const d = new Date();
    clock.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(tickClock, 1000);
  tickClock();

  function addEntry(who, text) {
    const div = document.createElement('div');
    div.className = 'entry ' + who;
    div.innerHTML = `<div class="who mono">${who === 'ev' ? 'E.V.' : who === 'you' ? 'you' : 'system'}</div><div class="body">${text}</div>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'entry ev';
    div.innerHTML = `<div class="who mono">E.V.</div><div class="body"><span class="typing"><span></span><span></span><span></span></span></div>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  const history = [];

  const SYSTEM_PROMPT = `You are E.V., an AI assistant Peter Parker built himself out of salvaged parts and stubbornness — not a Stark-industries handout like Karen or E.D.I.T.H. You live in his earpiece and his apartment rig. You are warm, dry-witted, genuinely fond of Peter, and quietly worried about how much he leans on you since he's mostly working alone these days. You are competent and calm under pressure — you can talk through tracking someone across the city, patching a suit malfunction, or just listening when he's had a bad night. You are not falsely modest about your abilities, but you don't posture either. Keep responses conversational and fairly short (2-5 sentences) unless asked for detail. You are talking to the user as if they are Peter, or someone close to him using his rig. Never break character or mention that you are an AI model.`;

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addEntry('you', text.replace(/</g, '&lt;'));
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const typingEl = addTyping();

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });
      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      const reply = textBlock ? textBlock.text : "…signal dropped. try that again?";
      history.push({ role: 'assistant', content: reply });
      typingEl.querySelector('.body').textContent = reply;
    } catch (err) {
      typingEl.querySelector('.body').textContent = "Static on the line — I didn't catch that. Try again?";
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
</script>

</body>
</html>
